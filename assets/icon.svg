<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Zero Hour">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="0.55" stop-color="#ff4f7b"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4f7b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff4f7b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <!-- The zero: a ring drawn clockwise from 12 o'clock that has not quite closed -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="url(#ring)" stroke-width="42" stroke-linecap="round"
          stroke-dasharray="727 855" transform="rotate(-90 256 256)"/>
  <!-- The hand: points at where the ring ends, so it reads as time running down -->
  <g transform="rotate(-60 256 256)">
    <path d="M256 256 V166" stroke="#fff4ea" stroke-width="28" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="256" cy="256" r="17" fill="#fff4ea"/>
</svg>
